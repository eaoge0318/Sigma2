        <div style="padding:10px 14px;border-bottom:1px solid #f1f5f9;display:flex;gap:6px;align-items:center;">
            <input id="col-pick-search" type="text" placeholder="搜尋欄位…" oninput="_colPickFilter()" style="flex:1;padding:5px 10px;border:1px solid #e2e8f0;border-radius:7px;font-size:12px;outline:none;" onfocus="this.style.borderColor='#6366f1'" onblur="this.style.borderColor='#e2e8f0'">
            <button onclick="_colPickSelectAll(true)"  style="padding:4px 10px;font-size:11px;border:1px solid #e2e8f0;border-radius:6px;background:#f8fafc;cursor:pointer;color:#475569;">全選</button>
            <button onclick="_colPickSelectAll(false)" style="padding:4px 10px;font-size:11px;border:1px solid #e2e8f0;border-radius:6px;background:#f8fafc;cursor:pointer;color:#475569;">清除額外</button>
        </div>
        <div id="col-pick-list" style="overflow-y:auto;flex:1;padding:8px 0;"></div>
        <div style="padding:12px 20px;border-top:1px solid #e2e8f0;display:flex;justify-content:flex-end;gap:8px;">
            <button onclick="document.getElementById('col-pick-modal').style.display='none'" style="padding:8px 16px;border:1px solid #e2e8f0;border-radius:8px;background:#f8fafc;font-size:13px;color:#475569;cursor:pointer;">取消</button>
            <button onclick="_colPickConfirm()" style="padding:8px 20px;border:none;border-radius:8px;background:#6366f1;font-size:13px;color:#fff;font-weight:600;cursor:pointer;" onmouseenter="this.style.background='#4f46e5'" onmouseleave="this.style.background='#6366f1'">確認套用</button>
        </div>
    </div>
</div>
<script>
let _colPickData = null; // { mappedParts, extraCols, fromMatch, previewSql, appliedDefs, tab }

async function _showColPickModal(mappedParts, extraCols, fromMatch, previewSql, appliedDefs, tab, allTableCols) {
    // 建立 mapped 欄位的查找 map: "tref.[col]".lower -> index in mappedParts
    const mappedIndex = {};
    mappedParts.forEach((p, i) => {
        const m = p.trim().match(/^(\S+\.\[\S+\])\s+AS/i);
        if (m) mappedIndex[m[1].toLowerCase()] = i;
    });

    // 依 DB 欄位順序建立統一清單
    // allTableCols = [{tRef, col, table}, ...] 已按 DB 順序
    const orderedItems = []; // {type:'mapped'|'extra', mappedIdx?, extraItem?}
    const usedMapped = new Set();
    const usedExtra = new Set();

    if (allTableCols && allTableCols.length) {
        allTableCols.forEach(c => {
            const key = `${c.tRef}.[${c.col}]`.toLowerCase();
            if (mappedIndex[key] !== undefined) {
                orderedItems.push({ type: 'mapped', mappedIdx: mappedIndex[key] });
                usedMapped.add(mappedIndex[key]);
            } else {
                const ei = extraCols.findIndex(e => e.tRef === c.tRef && e.col === c.col);
                if (ei !== -1) {
                    orderedItems.push({ type: 'extra', extraIdx: ei });
                    usedExtra.add(ei);
                }
            }
        });
    }
    // 加入沒被 allTableCols 覆蓋的（如多表 join 裡其他表的對應欄位）
    mappedParts.forEach((_, i) => { if (!usedMapped.has(i)) orderedItems.push({ type: 'mapped', mappedIdx: i }); });
    extraCols.forEach((_, i) => { if (!usedExtra.has(i)) orderedItems.push({ type: 'extra', extraIdx: i }); });

    _colPickData = { mappedParts, extraCols, fromMatch, previewSql, appliedDefs, tab, orderedItems };
    const list = document.getElementById('col-pick-list');
    document.getElementById('col-pick-search').value = '';

    const mappedCount = mappedParts.length;
    let html = `<div style="padding:4px 14px 2px;font-size:10px;font-weight:700;color:#6366f1;letter-spacing:.5px;">✦ 對應欄位（${mappedCount} 個）；可額外勾選要保留的其他欄位</div>`;
    orderedItems.forEach((item, i) => {
        if (item.type === 'mapped') {
            const p = mappedParts[item.mappedIdx];
            const label = p.trim().replace(/^\s*\S+\.\[(\S+)\]\s+AS\s+\[(.+)\]\s*$/i, '$1 → $2') || p.trim();
            html += `<label style="display:flex;align-items:center;gap:8px;padding:4px 14px;cursor:pointer;">
                <input type="checkbox" checked data-mapped="1" data-order="${i}" data-midx="${item.mappedIdx}" style="accent-color:#6366f1;width:14px;height:14px;">
                <span style="font-size:12px;color:#1e293b;">${escHtml(label)}</span>
            </label>`;
        } else {
            const c = extraCols[item.extraIdx];
            html += `<label style="display:flex;align-items:center;gap:8px;padding:4px 14px;cursor:pointer;">
                <input type="checkbox" data-extra="1" data-order="${i}" data-eidx="${item.extraIdx}" style="accent-color:#475569;width:14px;height:14px;">
                <span style="font-size:12px;color:#94a3b8;">${escHtml(c.tRef)}.<span style="color:#475569;">${escHtml(c.col)}</span></span>
            </label>`;
        }
    });
    list.innerHTML = html;
    document.getElementById('col-pick-modal').style.display = 'flex';
}

function _colPickFilter() {
    const kw = document.getElementById('col-pick-search').value.toLowerCase();
    document.querySelectorAll('#col-pick-list label').forEach(row => {
        row.style.display = (!kw || row.textContent.toLowerCase().includes(kw)) ? '' : 'none';
    });
}

function _colPickSelectAll(wantAll) {
    document.querySelectorAll('#col-pick-list input[data-extra]').forEach(cb => {
        cb.checked = wantAll;
    });
}

async function _colPickConfirm() {
    document.getElementById('col-pick-modal').style.display = 'none';
    const { mappedParts, extraCols, fromMatch, previewSql, appliedDefs, tab } = _colPickData;

    // 按畫面順序收集所有勾選欄位（已按 DB 順序排列）
    const { orderedItems } = _colPickData;
    const allParts = [];
    document.querySelectorAll('#col-pick-list input').forEach(cb => {
        if (!cb.checked) return;
        if (cb.dataset.mapped) {
            allParts.push(mappedParts[parseInt(cb.dataset.midx)]);
        } else if (cb.dataset.extra) {
            const c = extraCols[parseInt(cb.dataset.eidx)];
            allParts.push(`  ${c.tRef}.[${c.col}]`);
        }
    });
    if (!allParts.length) { alert('請至少選擇一個欄位'); return; }

    const selectCols = allParts.join(',\n');
    let wrappedSql, exportSql;
    if (fromMatch) {
        wrappedSql = `SELECT TOP 100\n${selectCols}\n${fromMatch[1]}`;
        exportSql  = `SELECT\n${selectCols}\n${fromMatch[1]}`;
    } else {
        wrappedSql = `SELECT TOP 100\n${selectCols}\nFROM (\n  ${previewSql}\n) AS _src`;
        exportSql  = `SELECT\n${selectCols}\nFROM (\n  ${previewSql}\n) AS _src`;
    }

    const resultEmpty = document.getElementById('result-empty');
    const btn = document.getElementById('btn-apply-mapping');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>';
    clearResultTable();
    resultEmpty.innerHTML = '<span class="spinner"></span><span style="color:#64748b;">套用對應中…</span>';

    try {
        console.log('[套用對應] 生成的 SQL:', wrappedSql);
        const r = await fetch('/api/db/preview', {
            method: 'POST', headers: {'Content-Type':'application/json'},
            body: JSON.stringify({connection_id: _currentConnId, sql: wrappedSql, limit: 100, session_id: _sessionId})
        });
        if (!r.ok) throw new Error((await r.json().catch(()=>({detail:r.statusText}))).detail);
        const d = await r.json();
        if (tab) { tab.previewSql = wrappedSql; tab.exportSql = exportSql; }
        renderResultTable(d.columns, d.rows);
        setRunInfo(`${d.row_count} 筆 | ${d.duration_ms}ms  ✦ 已套用 ${appliedDefs.join(', ')}`);
    } catch(e) {
        showError(String(e));
    } finally {
        btn.disabled = false;
        btn.innerHTML = '🔄 套用對應欄位';
    }
}
</script>

<!-- 匯出 CSV 對話框 -->
<div id="export-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:9999;align-items:center;justify-content:center;">
    <div style="background:#fff;border-radius:14px;padding:24px;width:380px;max-width:95vw;box-shadow:0 20px 60px rgba(0,0,0,0.25);display:flex;flex-direction:column;gap:14px;">
        <div style="display:flex;align-items:center;justify-content:space-between;">
            <div style="font-size:15px;font-weight:700;color:#1e293b;">⬇ 匯出 CSV</div>
            <span onclick="closeExportDialog()" style="cursor:pointer;color:#94a3b8;font-size:18px;" title="關閉">✕</span>
        </div>
        <div id="export-mapped-hint" style="display:none;background:#eef2ff;border-radius:8px;padding:8px 12px;font-size:11px;color:#4f46e5;">
            ✦ 將使用套用對應後的欄位匯出
        </div>
        <div>
            <label style="font-size:12px;color:#64748b;display:block;margin-bottom:5px;">檔案名稱</label>
            <div style="display:flex;align-items:center;gap:6px;">
                <input id="export-filename" type="text" style="flex:1;padding:8px 10px;border:1.5px solid #e2e8f0;border-radius:8px;font-size:13px;color:#1e293b;outline:none;" onfocus="this.style.borderColor='#6366f1'" onblur="this.style.borderColor='#e2e8f0'" onkeydown="if(event.key==='Enter')doExport()">
                <span style="font-size:12px;color:#94a3b8;">.csv</span>
            </div>
        </div>
        <div style="font-size:11px;color:#94a3b8;">檔案將儲存至「檔案管理」，可在主頁面開啟。</div>
        <div style="display:flex;gap:8px;justify-content:flex-end;">
            <button onclick="closeExportDialog()" style="padding:8px 16px;border:1px solid #e2e8f0;border-radius:8px;background:#f8fafc;font-size:13px;color:#475569;cursor:pointer;">取消</button>
            <button onclick="doExport()" style="padding:8px 20px;border:none;border-radius:8px;background:#059669;font-size:13px;color:#fff;font-weight:600;cursor:pointer;" onmouseenter="this.style.background='#047857'" onmouseleave="this.style.background='#059669'">確認匯出</button>
        </div>
    </div>
</div>
<script>
// 匯出對話框不允許點背景關閉，避免誤觸

// ── Sidebar resize drag ──
(function() {
    const handle = document.getElementById('db-resize-handle');
    const sidebar = document.getElementById('db-sidebar');
    if (!handle || !sidebar) return;
    let dragging = false, startX = 0, startW = 0;
    handle.addEventListener('mousedown', e => {
        e.preventDefault();
        dragging = true; startX = e.clientX; startW = sidebar.offsetWidth;
        handle.classList.add('dragging');
        document.body.style.cursor = 'col-resize';
        document.body.style.userSelect = 'none';
    });
    document.addEventListener('mousemove', e => {
        if (!dragging) return;
        const w = Math.min(500, Math.max(140, startW + e.clientX - startX));
        sidebar.style.width = w + 'px';
    });
    document.addEventListener('mouseup', () => {
        if (!dragging) return;
        dragging = false;
        handle.classList.remove('dragging');
        document.body.style.cursor = '';
        document.body.style.userSelect = '';
    });
})();
</script>
